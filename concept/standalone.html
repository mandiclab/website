document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

otId }}\" shape=\"rect\" fit=\"cover\" placeholder=\" \"><\u002Fimage-slot>\n                  <\u002Fdiv>\n                  <div data-ml=\"pcard-body\" style=\"position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:32px;background:rgba(10,10,10,0.74)\">\n                    <div>\n                      <h2 data-ml=\"pcard-title\" style=\"margin:0;font-size:24px;font-weight:500;letter-spacing:-0.01em;line-height:1.15\">{{ card.title }}<\u002Fh2>\n                      <p style=\"margin:24px 0 0;max-width:46ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">{{ card.desc }}<\u002Fp>\n                    <\u002Fdiv>\n                    <div data-ml=\"pcard-foot\" style=\"display:flex;align-items:center;justify-content:space-between;gap:24px\">\n                      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;flex:1 1 auto;min-width:0\">\n                        <sc-for list=\"{{ card.tags }}\" as=\"tag\" hint-placeholder-count=\"2\">\n                          <span style=\"{{ tag.style }}\">{{ tag.label }}<\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <a href=\"#top\" sc-camel-on-click=\"{{ card.onOpen }}\" style=\"display:inline-flex;flex:0 0 auto;white-space:nowrap;align-items:center;gap:12px;padding:12px 24px;border:1px solid rgba(242,242,240,0.16);background:rgba(242,242,240,0.08);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);font-size:12px;font-weight:400;letter-spacing:0.18em;color:#F2F2F0;text-decoration:none;transition:background 500ms cubic-bezier(.16,1,.3,1),border-color 500ms cubic-bezier(.16,1,.3,1)\" style-hover=\"background:rgba(242,242,240,0.16);border-color:rgba(242,242,240,0.28)\">\n                        Show more\n                      <\u002Fa>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ pEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"max-width:1280px;padding:clamp(32px,3vw,48px) 0;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.58)\">No projects match the current search and filter.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isProject }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"DJC-DIY\" style=\"padding-bottom:clamp(96px,10vh,128px)\">\n        <dc-import name=\"HeroSlideshow\" slides=\"{{ heroShow }}\" extra-slot=\"{{ heroExtra }}\" indicator=\"thumbs\" label=\"DJC-DIY slideshow\" frame-height=\"min(74vh,760px)\" frame-min-height=\"440px\" hint-size=\"100%,760px\"><\u002Fdc-import>\n        <div style=\"padding:0 clamp(24px,4vw,64px)\">\n          <div style=\"max-width:1280px;margin:0 auto\">\n\n            <h1 style=\"margin:clamp(64px,7vw,96px) 0 0;max-width:46ch;font-size:clamp(34px,4vw,56px);font-weight:200;line-height:1.15;letter-spacing:-0.01em;text-wrap:balance\">DJC-DIY<\u002Fh1>\n            <div style=\"display:flex;margin-top:clamp(16px,1.4vw,24px)\">\n              <span style=\"display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;padding:5px 10px;padding-right:calc(10px - 0.18em);border-radius:999px;border:1px solid rgba(159,227,193,0.28);background:rgba(159,227,193,0.08);color:#9FE3C1;font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase\">Open source<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:clamp(24px,2.6vw,48px) 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">DJC-DIY is an open-source DJ controller that you can make at home without special tools, skill or knowledge. It works with Mixxx, open-source DJ software.<\u002Fp>\n\n            <div data-ml=\"tabbar-wrap\" style=\"position:relative;margin-top:clamp(48px,5vw,64px);border-top:1px solid rgba(242,242,240,0.08);border-bottom:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)\">\n              <div data-ml=\"tabbar\" role=\"tablist\" aria-label=\"DJC-DIY sections\" style=\"display:flex;align-items:stretch;gap:clamp(8px,1.8vw,24px)\">\n                <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"5\">\n                  <button type=\"button\" role=\"tab\" id=\"{{ tab.tabId }}\" aria-controls=\"{{ tab.panelId }}\" aria-selected=\"{{ tab.selected }}\" sc-camel-tab-index=\"{{ tab.tabIndex }}\" sc-camel-on-key-down=\"{{ tab.onKeyDown }}\" data-active=\"{{ tab.active }}\" sc-camel-on-click=\"{{ tab.onClick }}\" style=\"position:relative;flex:0 0 auto;padding:24px clamp(12px,1.2vw,16px);cursor:pointer;font-size:12px;font-weight:400;letter-spacing:0.18em;white-space:nowrap;color:{{ tab.color }};transition:color 500ms cubic-bezier(.16,1,.3,1)\">\n                    {{ tab.label }}\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isPartsTab }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"tabpanel\" id=\"djc-panel-Parts\" aria-labelledby=\"djc-tab-Parts\" style=\"max-width:1280px;padding:clamp(64px,7vh,96px) 0 clamp(96px,12vh,128px)\">\n                <h2 style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Parts List<\u002Fh2>\n\n                <div style=\"margin-top:clamp(48px,5vh,64px)\">\n                  <div style=\"font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">3D Printed Parts<\u002Fdiv>\n                  <div style=\"margin-top:24px;overflow-x:auto\">\n                    <div data-ml=\"parts-table\" style=\"min-width:520px\">\n                      <div data-ml=\"parts-head\" style=\"display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:0 4px 12px;border-bottom:1px solid rgba(242,242,240,0.16);font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:rgba(242,242,240,0.58)\">\n                        <div>Quantity<\u002Fdiv><div>Part<\u002Fdiv><div>File Name<\u002Fdiv>\n                      <\u002Fdiv>\n                      <sc-for list=\"{{ printedParts }}\" as=\"row\" hint-placeholder-count=\"11\">\n                        <div data-ml=\"parts-row\" style=\"display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:16px 4px;border-bottom:1px solid rgba(242,242,240,0.04);font-size:15px;font-weight:300;line-height:1.55;color:rgba(242,242,240,0.78)\">\n                          <div style=\"color:rgba(242,242,240,0.58)\">{{ row.qty }}<\u002Fdiv>\n                          <div>{{ row.name }}<\u002Fdiv>\n                          <div style=\"color:rgba(242,242,240,0.58)\">{{ row.file }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:clamp(48px,5vh,64px);padding:clamp(24px,3vw,32px);border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)\">\n                  <div style=\"font-size:15px;font-weight:400;letter-spacing:0\">Order 3D Printed Parts From PCBWay<\u002Fdiv>\n                  <p style=\"margin:16px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">Thanks to our sponsor PCBWay, you can now order all 3D printed parts and have them delivered to your door. Not having access to a 3D printer is no longer a problem.<\u002Fp>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:24px\">\n                    <a href=\"https://www.pcbway.com/rapid-prototyping/manufacture/?type=3&amp;reffercode=Project&amp;projectattid=78823\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;padding:12px 24px;border:1px solid rgba(242,242,240,0.16);background:rgba(242,242,240,0.08);font-size:12px;font-weight:400;letter-spacing:0.18em;color:#F2F2F0;transition:background 500ms cubic-bezier(.16,1,.3,1),border-color 500ms cubic-bezier(.16,1,.3,1)\" style-hover=\"background:rgba(242,242,240,0.16);border-color:rgba(242,242,240,0.28)\">Order All 3D Printed Parts<\u002Fa>\n                    <a href=\"https://www.pcbway.com/project/shareproject/DIY_DJ_Controller_DJC_DIY_adac65c3.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;padding:12px 24px;border:1px solid rgba(242,242,240,0.08);font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.78);transition:border-color 500ms cubic-bezier(.16,1,.3,1),color 500ms cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:rgba(242,242,240,0.16);color:#F2F2F0\">See The Whole Project<\u002Fa>\n                  <\u002Fdiv>\n                  <p style=\"margin:24px 0 0;max-width:66ch;font-size:12px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.58)\">By ordering through PCBWay, you're also supporting the project and helping future development.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:clamp(64px,7vh,96px)\">\n                  <div style=\"font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Electronic Components<\u002Fdiv>\n                  <div style=\"margin-top:24px;overflow-x:auto\">\n                    <div data-ml=\"parts-table\" style=\"min-width:640px\">\n                      <div data-ml=\"parts-head\" style=\"display:grid;grid-template-columns:90px minmax(0,0.8fr) minmax(0,1.6fr);gap:24px;padding:0 4px 12px;border-bottom:1px solid rgba(242,242,240,0.16);font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:rgba(242,242,240,0.58)\">\n                        <div>Quantity<\u002Fdiv><div>Component<\u002Fdiv><div>Description<\u002Fdiv>\n                      <\u002Fdiv>\n                      <sc-for list=\"{{ electronics }}\" as=\"row\" hint-placeholder-count=\"7\">\n                        <div data-ml=\"parts-row\" style=\"display:grid;grid-template-columns:90px minmax(0,0.8fr) minmax(0,1.6fr);gap:24px;padding:16px 4px;border-bottom:1px solid rgba(242,242,240,0.04);font-size:15px;font-weight:300;line-height:1.55;color:rgba(242,242,240,0.78)\">\n                          <div style=\"color:rgba(242,242,240,0.58)\">{{ row.qty }}<\u002Fdiv>\n                          <div>{{ row.name }}<\u002Fdiv>\n                          <div style=\"color:rgba(242,242,240,0.58)\">{{ row.desc }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isOverviewTab }}\" hint-placeholder-val=\"{{ true }}\">\n              <div role=\"tabpanel\" id=\"djc-panel-Overview\" aria-labelledby=\"djc-tab-Overview\" style=\"width:100%;padding:clamp(64px,7vh,96px) 0 0\">\n                <div style=\"display:grid;grid-template-columns:{{ ovCols }};align-items:start;gap:clamp(48px,5vw,96px)\">\n                  <div style=\"min-width:0;display:flex;flex-direction:column;gap:clamp(64px,7vh,96px)\">\n                    <div>\n                      <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:clamp(16px,2.2vw,32px)\">\n                        <sc-for list=\"{{ videoTabs }}\" as=\"v\" hint-placeholder-count=\"3\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ v.onClick }}\" sc-camel-on-mouse-enter=\"{{ v.onEnter }}\" sc-camel-on-mouse-leave=\"{{ v.onLeave }}\" style=\"cursor:pointer;font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:{{ v.color }};text-shadow:{{ v.glow }};transition:color 500ms cubic-bezier(.16,1,.3,1),text-shadow 300ms cubic-bezier(.16,1,.3,1)\">{{ v.label }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"position:relative;width:100%;aspect-ratio:16/9;margin-top:24px;background:rgba(242,242,240,0.04);border:1px solid rgba(242,242,240,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:{{ videoFade }};transform:{{ videoShift }};transition:opacity 300ms cubic-bezier(.16,1,.3,1),transform 300ms cubic-bezier(.16,1,.3,1)\">\n                        <iframe src=\"{{ videoSrc }}\" title=\"DJC-DIY video\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;display:block\"><\u002Fiframe>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"min-width:0\">\n                    <h2 style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Info<\u002Fh2>\n                    <p style=\"margin:24px 0 0;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">DJC-DIY consists of two decks and a mixer.<\u002Fp>\n\n                    <div data-ml=\"info-grid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(24px,2.2vw,32px);max-width:var(--measure-narrow);margin-top:clamp(32px,3.4vh,48px)\">\n                      <div>\n                        <div style=\"font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Each deck<\u002Fdiv>\n                        <div style=\"margin-top:12px;border-top:1px solid rgba(242,242,240,0.08)\">\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">Jog wheel<\u002Fdiv>\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">Play / Pause<\u002Fdiv>\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">Cue<\u002Fdiv>\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">2 performance pads<\u002Fdiv>\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">Tempo fader<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <div>\n                        <div style=\"font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Mixer<\u002Fdiv>\n                        <div style=\"margin-top:12px;border-top:1px solid rgba(242,242,240,0.08)\">\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">Low EQ<\u002Fdiv>\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">2 FX knobs<\u002Fdiv>\n                          <div style=\"padding:8px 0;font-size:15px;font-weight:300;color:rgba(242,242,240,0.78)\">Crossfader<\u002Fdiv>\n                        <\u002Fdiv>\n                        <p style=\"margin:24px 0 0;font-size:13px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.58);text-wrap:pretty\">The FX knobs can also be remapped for other functions, such as additional EQ controls or channel volume.<\u002Fp>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <p style=\"margin:clamp(32px,4vh,48px) 0 0;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">A <a href=\"https://www.youtube.com/watch?v=gbPC8Bg0U9I\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#F2F2F0;border-bottom:1px solid rgba(242,242,240,0.28);transition:border-color 300ms cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:rgba(242,242,240,0.78)\">preview<\u002Fa>, <a href=\"https://www.youtube.com/watch?v=WDb8kAIuzXc\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#F2F2F0;border-bottom:1px solid rgba(242,242,240,0.28);transition:border-color 300ms cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:rgba(242,242,240,0.78)\">detailed build tutorial<\u002Fa>, and <a href=\"https://www.youtube.com/watch?v=Z4C7toXesU8\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#F2F2F0;border-bottom:1px solid rgba(242,242,240,0.28);transition:border-color 300ms cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:rgba(242,242,240,0.78)\">professional DJ demo<\u002Fa> are available on YouTube.<\u002Fp>\n\n                    <p style=\"margin:24px 0 0;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">DJC-DIY was designed so its parts can be printed even on very small 3D printers. If you do not have access to a 3D printer, the printed parts can be <a href=\"https://www.pcbway.com/rapid-prototyping/manufacture/?type=3&amp;reffercode=Project&amp;projectattid=78823\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#F2F2F0;border-bottom:1px solid rgba(242,242,240,0.28);transition:border-color 300ms cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:rgba(242,242,240,0.78)\">ordered from PCBWay<\u002Fa>, where you can also see <a href=\"https://www.pcbway.com/project/shareproject/DIY_DJ_Controller_DJC_DIY_adac65c3.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#F2F2F0;border-bottom:1px solid rgba(242,242,240,0.28);transition:border-color 300ms cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:rgba(242,242,240,0.78)\">the whole project<\u002Fa>.<\u002Fp>\n\n                    <div data-ml=\"repo-actions\" style=\"display:flex;flex-wrap:nowrap;gap:12px;margin-top:clamp(32px,4.5vh,48px)\">\n                      <a href=\"https://github.com/mandiclab/djc-diy\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;flex:0 0 auto;white-space:nowrap;align-items:center;gap:8px;padding:12px 16px;border:1px solid rgba(242,242,240,0.16);background:rgba(242,242,240,0.08);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);font-size:12px;font-weight:400;letter-spacing:0.18em;color:#F2F2F0;transition:background 500ms cubic-bezier(.16,1,.3,1),border-color 500ms cubic-bezier(.16,1,.3,1)\" style-hover=\"background:rgba(242,242,240,0.16);border-color:rgba(242,242,240,0.28)\">\n                        <span style=\"display:block;width:14px;height:14px;background:#F2F2F0;mask:{{ githubMask }};-webkit-mask:{{ githubMask }}\"><\u002Fspan>\n                        GitHub Repo\n                      <\u002Fa>\n                      <a href=\"https://github.com/mandiclab/djc-diy/archive/refs/tags/v1.1.0.zip\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;flex:0 0 auto;white-space:nowrap;align-items:center;gap:8px;padding:12px 16px;border:1px solid rgba(242,242,240,0.16);background:rgba(242,242,240,0.08);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);font-size:12px;font-weight:400;letter-spacing:0.18em;color:#F2F2F0;transition:background 500ms cubic-bezier(.16,1,.3,1),border-color 500ms cubic-bezier(.16,1,.3,1)\" style-hover=\"background:rgba(242,242,240,0.16);border-color:rgba(242,242,240,0.28)\">\n                        <span style=\"display:block;width:14px;height:14px;background:#F2F2F0;mask:{{ githubMask }};-webkit-mask:{{ githubMask }}\"><\u002Fspan>\n                        Download\n                      <\u002Fa>\n                      <a href=\"https://ko-fi.com/mandiclab\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;flex:0 0 auto;white-space:nowrap;align-items:center;gap:8px;padding:12px 16px;border:1px solid rgba(242,242,240,0.16);background:rgba(242,242,240,0.08);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);font-size:12px;font-weight:400;letter-spacing:0.18em;color:#F2F2F0;transition:background 500ms cubic-bezier(.16,1,.3,1),border-color 500ms cubic-bezier(.16,1,.3,1)\" style-hover=\"background:rgba(242,242,240,0.16);border-color:rgba(242,242,240,0.28)\">\n                        <span style=\"display:block;width:14px;height:14px;background:#F2F2F0;mask:{{ kofiMask }};-webkit-mask:{{ kofiMask }}\"><\u002Fspan>\n                        Support\n                      <\u002Fa>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"width:100%\">\n                <div style=\"margin-top:clamp(96px,10vh,128px);padding:clamp(48px,5.5vh,64px) 0 clamp(96px,12vh,128px)\">\n                  <div style=\"display:flex;align-items:center;gap:clamp(16px,2vw,32px)\">\n                    <div style=\"flex:1 1 auto;height:1px;background:rgba(242,242,240,0.08)\"><\u002Fdiv>\n                    <h2 style=\"margin:0;flex:0 0 auto;font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Gallery<\u002Fh2>\n                    <div style=\"flex:1 1 auto;height:1px;background:rgba(242,242,240,0.08)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"column-width:clamp(150px,12vw,210px);column-gap:clamp(12px,1.1vw,16px);margin-top:clamp(32px,3.6vh,48px)\">\n                    <sc-for list=\"{{ gallery }}\" as=\"shot\" hint-placeholder-count=\"6\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ shot.onClick }}\" style=\"display:block;position:relative;width:100%;aspect-ratio:{{ shot.ratio }};margin:0 0 clamp(12px,1.1vw,16px);break-inside:avoid;overflow:hidden;background:rgba(242,242,240,0.04);border:1px solid rgba(242,242,240,0.08);cursor:pointer;transition:transform 300ms cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:scale(1.02)\">\n                        <image-slot id=\"{{ shot.slotId }}\" shape=\"rect\" fit=\"{{ shot.fit }}\" placeholder=\" \"><\u002Fimage-slot>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ lbOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ lbLabel }}\" sc-camel-tab-index=\"-1\" ref=\"{{ lbRef }}\" sc-camel-on-key-down=\"{{ lbKeyDown }}\" sc-camel-on-click=\"{{ lbClose }}\" sc-camel-on-touch-start=\"{{ lbTouchStart }}\" sc-camel-on-touch-end=\"{{ lbTouchEnd }}\" style=\"position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:clamp(16px,2vh,32px) clamp(16px,1.6vw,24px);box-sizing:border-box;background:rgba(11,11,12,0.34);backdrop-filter:blur(14px) saturate(118%);-webkit-backdrop-filter:blur(14px) saturate(118%);opacity:{{ lbShellOpacity }};transition:opacity 300ms cubic-bezier(.16,1,.3,1)\">\n                    <div style=\"position:relative;z-index:4;display:flex;flex-direction:{{ lbCompDir }};align-items:center;justify-content:center;gap:clamp(24px,3vw,48px);max-width:100%;max-height:100%;opacity:{{ lbImgOpacity }};transform:{{ lbImgTransform }};transition:opacity {{ lbImgMs }} cubic-bezier(.16,1,.3,1),transform {{ lbImgMs }} cubic-bezier(.16,1,.3,1)\">\n                      <div sc-camel-on-click=\"{{ lbStop }}\" style=\"position:relative;flex:0 0 auto;line-height:0\">\n                        {{ lbImgEl }}\n                        <sc-if value=\"{{ lbShowA }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"position:absolute;top:50%;left:50%;z-index:1;line-height:0;opacity:{{ lbOpacityA }};transform:{{ lbTransformA }};transition:opacity {{ lbDurO }} cubic-bezier(.16,1,.3,1),transform {{ lbDurT }} cubic-bezier(.16,1,.3,1)\">\n                            {{ lbImgElA }}\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ lbShowB }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"position:absolute;top:50%;left:50%;z-index:1;line-height:0;opacity:{{ lbOpacityB }};transform:{{ lbTransformB }};transition:opacity {{ lbDurO }} cubic-bezier(.16,1,.3,1),transform {{ lbDurT }} cubic-bezier(.16,1,.3,1)\">\n                            {{ lbImgElB }}\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n\n                        <button type=\"button\" data-ml=\"lb-close\" sc-camel-on-mouse-enter=\"{{ lbCloseEnter }}\" sc-camel-on-mouse-leave=\"{{ lbCloseLeave }}\" sc-camel-on-click=\"{{ lbClose }}\" style=\"position:absolute;bottom:100%;left:100%;z-index:3;width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;transform:{{ lbCloseXform }};pointer-events:auto;cursor:pointer\">\n                          <span style=\"position:relative;display:block;width:15px;height:15px;opacity:{{ lbCloseOpacity }};transition:opacity 500ms cubic-bezier(.16,1,.3,1)\">\n                            <span style=\"position:absolute;top:50%;left:0;width:100%;height:1px;background:#F2F2F0;transform:rotate(45deg)\"><\u002Fspan>\n                            <span style=\"position:absolute;top:50%;left:0;width:100%;height:1px;background:#F2F2F0;transform:rotate(-45deg)\"><\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ lbHasInfo }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div sc-camel-on-click=\"{{ lbStop }}\" style=\"flex:0 1 auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(24px,2.4vh,32px);width:{{ lbInfoWidth }};max-width:100%;max-height:100%;box-sizing:border-box;overflow-y:auto;opacity:{{ lbInfoOpacity }};transition:opacity 500ms cubic-bezier(.16,1,.3,1)\">\n                        <sc-if value=\"{{ lbHasLinks }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"display:flex;flex-direction:column;gap:4px\">\n                            <sc-for list=\"{{ lbLinks }}\" as=\"link\" hint-placeholder-count=\"1\">\n                              <a href=\"{{ link.href }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,242,240,0.08);font-size:13px;font-weight:300;letter-spacing:0;color:rgba(242,242,240,0.78);transition:color 300ms cubic-bezier(.16,1,.3,1)\" style-hover=\"color:#F2F2F0\">\n                                <span style=\"display:block;flex:0 0 auto;width:15px;height:15px;background:rgba(242,242,240,0.78);mask:{{ link.mask }};-webkit-mask:{{ link.mask }}\"><\u002Fspan>\n                                {{ link.handle }}\n                              <\u002Fa>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ lbHasDesc }}\" hint-placeholder-val=\"{{ false }}\">\n                          <p style=\"margin:0;max-width:46ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">{{ lbDesc }}<\u002Fp>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n\n                    <button type=\"button\" sc-camel-on-mouse-enter=\"{{ lbPrevEnter }}\" sc-camel-on-mouse-leave=\"{{ lbEdgeLeave }}\" sc-camel-on-click=\"{{ lbPrev }}\" style=\"position:absolute;z-index:6;left:0;top:0;bottom:0;width:clamp(58px,8vw,120px);display:flex;align-items:center;justify-content:center;cursor:pointer\">\n                      <span style=\"display:block;width:13px;height:13px;border-left:1px solid #F2F2F0;border-top:1px solid #F2F2F0;transform:rotate(-45deg);opacity:{{ lbPrevOpacity }};transition:opacity 500ms cubic-bezier(.16,1,.3,1)\"><\u002Fspan>\n                    <\u002Fbutton>\n\n                    <button type=\"button\" sc-camel-on-mouse-enter=\"{{ lbNextEnter }}\" sc-camel-on-mouse-leave=\"{{ lbEdgeLeave }}\" sc-camel-on-click=\"{{ lbNext }}\" style=\"position:absolute;z-index:6;right:0;top:0;bottom:0;width:clamp(58px,8vw,120px);display:flex;align-items:center;justify-content:center;cursor:pointer\">\n                      <span style=\"display:block;width:13px;height:13px;border-right:1px solid #F2F2F0;border-top:1px solid #F2F2F0;transform:rotate(45deg);opacity:{{ lbNextOpacity }};transition:opacity 500ms cubic-bezier(.16,1,.3,1)\"><\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isAssemblyTab }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"tabpanel\" id=\"djc-panel-Assembly\" aria-labelledby=\"djc-tab-Assembly\" style=\"max-width:1280px;padding:clamp(64px,7vh,96px) 0 clamp(96px,12vh,128px)\">\n                <h2 style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Assembly Guide<\u002Fh2>\n\n                <div style=\"display:flex;flex-direction:column;gap:clamp(48px,6vh,64px);margin-top:clamp(48px,5.5vh,64px)\">\n\n                  <div>\n                    <div style=\"display:flex;gap:16px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid rgba(242,242,240,0.08)\">\n                      <span style=\"font-size:13px;font-weight:300;color:rgba(242,242,240,0.58)\">01<\u002Fspan>\n                      <span style=\"font-size:17px;font-weight:400;letter-spacing:-0.01em\">Acquire electronic components<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">Acquire all electronic components from the electronic components list.<br>I personally bought everything from Aliexpress and had no problems.<\u002Fp>\n                  <\u002Fdiv>\n\n                  <div>\n                    <div style=\"display:flex;gap:16px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid rgba(242,242,240,0.08)\">\n                      <span style=\"font-size:13px;font-weight:300;color:rgba(242,242,240,0.58)\">02<\u002Fspan>\n                      <span style=\"font-size:17px;font-weight:400;letter-spacing:-0.01em\">3D print parts<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">3D print all parts from the 3D printed parts list.<br>I used max speed, 15% infill, .2mm layer height. Use support where needed.<br>If something can’t be pulled onto a part, try printing it at 105% scale.<\u002Fp>\n                  <\u002Fdiv>\n\n                  <div>\n                    <div style=\"display:flex;gap:16px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid rgba(242,242,240,0.08)\">\n                      <span style=\"font-size:13px;font-weight:300;color:rgba(242,242,240,0.58)\">03<\u002Fspan>\n                      <span style=\"font-size:17px;font-weight:400;letter-spacing:-0.01em\">Wire electronics in the case<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">Here you can see an illustrated schematic.<br>Solder everything as shown.<\u002Fp>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">This is the layout of the electronic components.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;margin-top:24px;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04)\">\n                      <span style=\"font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.58);text-align:center;padding:0 24px\">Assembly image placeholder — component layout<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <p style=\"margin:32px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">First solder left rotary encoder.<br>At the beginning, solder the pins from the bottom side of the Arduino.<br>Use this opportunity to leave more space on the top side for later, because once several electronic components are soldered in place, the Arduino will no longer be movable, and soldering from the bottom side of the pins will no longer be possible.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;margin-top:24px;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04)\">\n                      <span style=\"font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.58);text-align:center;padding:0 24px\">Assembly image placeholder — left rotary encoder<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <p style=\"margin:32px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Then solder right rotary encoder.<br>Also solder the pins from the bottom side.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;margin-top:24px;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04)\">\n                      <span style=\"font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.58);text-align:center;padding:0 24px\">Assembly image placeholder — right rotary encoder<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <p style=\"margin:32px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Next are buttons for the left deck.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;margin-top:24px;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04)\">\n                      <span style=\"font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.58);text-align:center;padding:0 24px\">Assembly image placeholder — left deck buttons<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <p style=\"margin:32px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Then buttons for the right deck.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;margin-top:24px;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04)\">\n                      <span style=\"font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.58);text-align:center;padding:0 24px\">Assembly image placeholder — right deck buttons<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <p style=\"margin:32px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">And the last are potentiometers.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;margin-top:24px;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04)\">\n                      <span style=\"font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.58);text-align:center;padding:0 24px\">Assembly image placeholder — potentiometers<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <p style=\"margin:32px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">It should look like this when everything is soldered.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;margin-top:24px;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04)\">\n                      <span style=\"font-size:12px;font-weight:400;letter-spacing:0.18em;color:rgba(242,242,240,0.58);text-align:center;padding:0 24px\">Assembly image placeholder — final soldered wiring<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div>\n                    <div style=\"display:flex;gap:16px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid rgba(242,242,240,0.08)\">\n                      <span style=\"font-size:13px;font-weight:300;color:rgba(242,242,240,0.58)\">04<\u002Fspan>\n                      <span style=\"font-size:17px;font-weight:400;letter-spacing:-0.01em\">Install firmware<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Open firmware.ino with Arduino IDE.<br>Select your board.<\u002Fp>\n                    <div style=\"margin-top:24px;padding:24px 24px;border:1px solid rgba(232,145,137,0.28);background:rgba(232,145,137,0.08)\">\n                      <div style=\"font-size:13px;font-weight:400;line-height:1.55;color:#E89189\">Warning<\u002Fdiv>\n                      <p style=\"margin:16px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">If your board is already selected, use it as is. Some arduino clones can only work like that and you can break them otherwise.<\u002Fp>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Install MIDIUSB library from Gary Grewal.<br>Then upload the code.<\u002Fp>\n                  <\u002Fdiv>\n\n                  <div>\n                    <div style=\"display:flex;gap:16px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid rgba(242,242,240,0.08)\">\n                      <span style=\"font-size:13px;font-weight:300;color:rgba(242,242,240,0.58)\">05<\u002Fspan>\n                      <span style=\"font-size:17px;font-weight:400;letter-spacing:-0.01em\">Install mapping files<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">Copy \"DJC-DIY.xml\" and \"DJC-DIY-scripts.js\" to \"C:\\Users\\username\\AppData\\Local\\Mixxx\\controllers\".<\u002Fp>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">Select mapping files by going to the preferences. (Options &gt; Preferences or Ctrl + P)<br>Go to the controllers tab and choose something like Arduino/ProMicro/Leonardo.<br>Then go to the load mapping and select DJC-DIY.<\u002Fp>\n                  <\u002Fdiv>\n\n                  <div>\n                    <div style=\"display:flex;gap:16px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid rgba(242,242,240,0.08)\">\n                      <span style=\"font-size:13px;font-weight:300;color:rgba(242,242,240,0.58)\">06<\u002Fspan>\n                      <span style=\"font-size:17px;font-weight:400;letter-spacing:-0.01em\">Test the device<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Test your device before assembling the rest of the 3D printed parts.<\u002Fp>\n                  <\u002Fdiv>\n\n                  <div>\n                    <div style=\"display:flex;gap:16px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid rgba(242,242,240,0.08)\">\n                      <span style=\"font-size:13px;font-weight:300;color:rgba(242,242,240,0.58)\">07<\u002Fspan>\n                      <span style=\"font-size:17px;font-weight:400;letter-spacing:-0.01em\">Assemble the rest 3D printed parts<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Assemble the rest 3D printed parts.<br>Feel free to use glue where needed.<\u002Fp>\n                  <\u002Fdiv>\n\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isSoftwareTab }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"tabpanel\" id=\"djc-panel-Software\" aria-labelledby=\"djc-tab-Software\" style=\"max-width:1280px;padding:clamp(64px,7vh,96px) 0 clamp(96px,12vh,128px)\">\n                <h2 style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;color:rgba(242,242,240,0.58)\">Required Software<\u002Fh2>\n                <p style=\"margin:24px 0 0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.58)\">Download and install the required software.<\u002Fp>\n                <div style=\"margin-top:cla elative;width:100%;height:min(74vh,760px);min-height:440px\">\n          <image-slot id=\"ml-er-hero\" shape=\"rect\" fit=\"cover\" placeholder=\" \"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"padding:0 clamp(24px,4vw,64px)\">\n          <div style=\"max-width:1280px;margin:0 auto\">\n            <div style=\"display:flex;gap:12px;margin-top:12px\">\n              <div style=\"position:relative;width:clamp(96px,10vw,148px);height:clamp(62px,6.4vw,94px);overflow:hidden\"><image-slot id=\"ml-er-thumb-1\" shape=\"rect\" fit=\"cover\" placeholder=\" \"><\u002Fimage-slot><\u002Fdiv>\n              <div style=\"position:relative;width:clamp(96px,10vw,148px);height:clamp(62px,6.4vw,94px);overflow:hidden\"><image-slot id=\"ml-er-thumb-2\" shape=\"rect\" fit=\"cover\" placeholder=\" \"><\u002Fimage-slot><\u002Fdiv>\n              <div style=\"position:relative;width:clamp(96px,10vw,148px);height:clamp(62px,6.4vw,94px);overflow:hidden\"><image-slot id=\"ml-er-thumb-3\" shape=\"rect\" fit=\"cover\" placeholder=\" \"><\u002Fimage-slot><\u002Fdiv>\n            <\u002Fdiv>\n\n            <h1 style=\"margin:clamp(64px,7vw,96px) 0 0;max-width:46ch;font-size:clamp(34px,4vw,56px);font-weight:200;line-height:1.15;letter-spacing:-0.01em;text-wrap:balance\">easyrace<\u002Fh1>\n            <div style=\"display:flex;margin-top:clamp(16px,1.4vw,24px)\">\n              <span style=\"display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;padding:5px 10px;padding-right:calc(10px - 0.18em);border-radius:999px;border:1px solid rgba(232,145,137,0.28);background:rgba(232,145,137,0.08);color:#E89189;font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase\">Digital product<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:clamp(32px,4vw,64px)\">\n            <div style=\"flex:1 1 440px;min-width:0;position:relative;margin-top:clamp(48px,4.4vw,64px);display:flex;flex-direction:column;gap:32px;max-width:66ch;padding:12px 0 0 16px\" style-before=\"content:'';position:absolute;left:-48px;right:-32px;top:-48px;bottom:-48px;background-image:repeating-linear-gradient(to right, rgba(242,242,240,0.04) 0 1px, transparent 1px 28px), repeating-linear-gradient(to bottom, rgba(242,242,240,0.04) 0 1px, transparent 1px 28px);mask-image:linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 9%, #000 93%, transparent 100%);mask-composite:intersect;-webkit-mask-image:linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 9%, #000 93%, transparent 100%);-webkit-mask-composite:source-in;pointer-events:none\">\n              <p style=\"margin:0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">Easyrace is a fully 3D printable DIY sim racing setup that you can make at home without special tools, skill or knowledge.<\u002Fp>\n              <p style=\"margin:0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78)\">Easyrace consists of:<br><span style=\"font-weight: 500; color: #F2F2F0;\">easysteer<\u002Fspan> — steering wheel<br><span style=\"font-weight: 500; color: #F2F2F0;\">easydrive<\u002Fspan> — pedals<br><span style=\"font-weight: 500; color: #F2F2F0;\">easyshift<\u002Fspan> — H-pattern and sequential shifter<br><span style=\"font-weight: 500; color: #F2F2F0;\">easydrift<\u002Fspan> — handbrake<\u002Fp>\n              <p style=\"margin:0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">Unlike any other DIY sim racing equipment, everything here is 3D printed. No screws, nuts, springs, sliders, shafts, bearings or similar mechanical parts are needed.<\u002Fp>\n              <p style=\"margin:0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">The electronics are reduced to the minimum, chosen to be affordable and reliable, and easy to source anywhere.<\u002Fp>\n              <p style=\"margin:0;max-width:66ch;font-size:15px;font-weight:300;line-height:1.65;color:rgba(242,242,240,0.78);text-wrap:pretty\">The building process is very simple. Everything has its own place, the amount of parts is reduced to a minimum, no special tools are required and everything is well explained in a video tutorial.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 380px;min-width:0;margin-top:clamp(48px,4.4vw,64px)\">\n              <div style=\"aspect-ratio:16/9;width:100%;border:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div data-ml=\"tabbar-wrap\" style=\"position:relative;margin-top:clamp(48px,5vw,64px);border-top:1px solid rgba(242,242,240,0.08);border-bottom:1px solid rgba(242,242,240,0.08);background:rgba(242,242,240,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)\">\n              <div data-ml=\"tabbar\" role=\"tablist\" aria-label=\"easyrace sections\" style=\"display:flex;align-items:stretch;gap:clamp(8px,1.8vw,24px)\">\n                <sc-for list=\"{{ erTabs }}\" as=\"tab\" hint-placeholder-count=\"5\">\n                  <button type=\"button\" role=\"tab\" id=\"{{ tab.tabId }}\" aria-controls=\"{{ tab.panelId }}\" aria-selected=\"{{ tab.selected }}\" sc-camel-tab-index=\"{{ tab.tabIndex }}\" sc-camel-on-key-down=\"{{ tab.onKeyDown }}\" data-active=\"{{ tab.active }}\" sc-camel-on-click=\"{{ tab.onClick }}\" style=\"position:relative;flex:0 0 auto;padding:24px clamp(12px,1.2vw,16px);cursor:pointer;font-size:12px;font-weight:400;letter-spacing:0.18em;white-space:nowrap;color:{{ tab.color }};transition:color 500ms cubic-bezier(.16,1,.3,1)\">\n The exception covers only\n  // these pills (project cards, product pages) — 11px elsewhere stays banned.\n  tagStyle(kind) {\n    const c = this.ACCENTS[kind];\n    return 'display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;padding:5px 10px;padding-right:calc(10px - 0.18em);border-radius:999px;border:1px solid rgba(' + c.rgb + ',0.28);background:rgba(' + c.rgb + ',0.08);color:' + c.hex + ';font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase';\n  }\n\n  toggleMenu(name) {\n    if (this.state.menu === name) { this.closeMenu(); return; }\n    clearTimeout(this._menuT);\n    this.setState({ menu: name, menuOut: this.state.menu || null });\n    this._menuT = setTimeout(() => this.setState({ menuOut: null }), 160);\n    this.clampMenu(name);\n  }\n\n  clampMenu(name) {\n    requestAnimationFrame(() => requestAnimationFrame(() => {\n      const menu = document.querySelector('[data-menu=\"' + name + '\"] [data-menu-panel]');\n      if (!menu) return;\n      menu.style.setProperty('--ml-shift', '0px');\n      const PAD = 16;\n      const r = menu.getBoundingClientRect();\n      let shift = 0;\n      if (r.left < PAD) shift = PAD - r.left;\n      else if (r.right > window.innerWidth - PAD) shift = (window.innerWidth - PAD) - r.right;\n      if (shift) menu.style.setProperty('--ml-shift', shift + 'px');\n    }));\n  }\n\n  closeMenu() {\n    if (!this.state.menu) return;\n    clearTimeout(this._menuT);\n    this.setState({ menuOut: this.state.menu, menu: null });\n    this._menuT = setTimeout(() => this.setState({ menuOut: null }), 160);\n  }\n\n  menuAnim(name) {\n    const inAnim = 'mlMenuIn 300ms cubic-bezier(0.22,1,0.36,1) both';\n    const outAnim = 'mlMenuOut 160ms cubic-bezier(0.4,0,1,1) both';\n    return this.state.menu === name ? inAnim : outAnim;\n  }\n\n  lbImg(src, style, extra, alt) {\n    if (!src) return null;\n    return React.createElement('img', Object.assign({ src: src, alt: alt || '', st onst el = els[k];\n      if (!el || !el.animate) return;\n      el.getAnimations().forEach(a => a.cancel());\n      el.animate(\n        [{ opacity: 1, transform: 'translateY(0) scale(1)' }, { opacity: 0, transform: 'translateY(-4px) scale(0.985)' }],\n        { duration: 220, easing: 'cubic-bezier(0.33,0,0.25,1)', fill: 'forwards' });\n    });\n    this._exitT = setTimeout(() => { this.capture(); this.setState(next, () => requestAnimationFrame(() => this.runFlip())); }, 235);\n  }\n\n  queueQuery(v) {\n    clearTimeout(this._qT);\n    this._qT = setTimeout(() => this.applyCatalog({ qA: v }), 110);\n  }\n\n  setSort(v) {\n    if (this.state.sort === v) return;\n    this.capture();\n    this.setState({ sort: v }, () => requestAnimationFrame(() => this.runFlip()));\n  }\n\n  galleryIds = ['ml-gal-1', 'ml-gal-2', 'ml-gal-3', 'ml-gal-4', 'ml-gal-5', 'ml-gal-6'];\n\n  // The background grid is anchored to the card column, so the column width and\n  // every block above it must land on whole grid units at any viewport width.\n  _gridSync = () => {\n    const sec = document.querySelector('[data-ml=\"proj-section\"]');\n    if (!sec) return;\n    const g = parseFloat(getComputedStyle(sec).getPropertyValue('--g')) || 46;\n    const inner = sec.querySelector('[data-ml=\"proj-inner\"]');\n    if (inner && inner.clientWidth) {\n      const avail = inner.clientWidth;\n      let cw = Math.floor(avail / g) * g;\n      if (cw > 21 * g) cw = 21 * g;\n      if (cw < 3 * g) cw = 3 * g;\n      sec.style.setProperty('--cw', cw + 'px');\n    }\n    const tb = sec.querySelector('[data-ml=\"proj-toolbar\"]');\n    const search = tb && tb.querySelector('[data-ml=\"proj-search\"]');\n    const ctl = tb && tb.querySelector('[data-ml=\"proj-controls\"]');\n    if (search && ctl) {\n      const sr = search.getBoundingClientRect(), cr = ctl.getBoundingClientRect();\n      const wrapped = cr.top >= sr.bottom - 1;\n      sec.style.setProperty('--tbh', (wrapped ? 3 * g : 2 * g) + 'px');\n    }\n scrollWidth - bar.clientWidth - bar.scrollLeft > 4;\n        wrap.setAttribute('data-fade', more ? '1' : '0');\n      }\n      const strips = document.querySelectorAll('[data-ml=\"bundles-scroll\"]');\n      for (let i = 0; i < strips.length; i++) {\n        const strip = strips[i];\n        const sw = strip.closest('[data-ml=\"bundles-wrap\"]');\n        if (!sw) continue;\n        const rest = strip.scrollWidth - strip.clientWidth - strip.scrollLeft > 4;\n        sw.setAttribute('data-fade', rest ? '1' : '0');\n      }\n    };\n    window.addEventListener('resize', this._tabFade);\n    document.addEventListener('scroll', this._tabFade, true);\n    this._tabFade();\n    this._lastTab = this.state.tab;\n    this._lastErTab = this.state.erTab;\n    this._lastPage = this.state.page;\n    this.setState({ vw: window.innerWidth, vh: window.innerHeight });\n    this._quietSlots();\n    this._gridSync();\n    this._startHeroScan();\n    // Each dropped photo drives its tile's aspect ratio, so the mosaic keeps\n    // every image at its natural proportions instead of a fixed card shape.\n    this._ratioScan = setInterval(() => {\n      const next = Object.assign({}, this.state.ratios || {});\n      let changed = false;\n      this.galleryIds.forEach(id => {\n        const el = document.getElementById(id);\n        const img = el && el.shadowRoot ? el.shadowRoot.querySelector('.frame img') : null;\n        if (!img || !img.naturalWidth || !img.naturalHeight) return;\n        const r = img.naturalWidth + '/' + img.naturalHeight;\n        if (next[id] !== r) { next[id] = r; changed = true; }\n      });\n      if (changed) this.setState({ ratios: next });\n    }, 700);\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    this._quietSlots();\n    this._gridSync();\n    // support.js passes prevProps only, so track the last values on the instance\n    const tab = this.state.tab, erTab = this.state.erTab, page = this.state.page;\n    if (this._lastTab !== tab || this._lastErT
